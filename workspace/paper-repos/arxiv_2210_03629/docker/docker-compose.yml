version: "3.8"

services:
  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: react-agent:latest
    env_file:
      - ../.env
    volumes:
      - ../:/workspace
    working_dir: /workspace
    command: >
      python evaluate.py --task hotpotqa --method react --config configs/config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  notebook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: react-agent:latest
    env_file:
      - ../.env
    volumes:
      - ../:/workspace
      - ../notebooks:/workspace/notebooks
    working_dir: /workspace
    ports:
      - "8888:8888"
    command: >
      bash -c "pip install --no-cache-dir jupyterlab &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"
